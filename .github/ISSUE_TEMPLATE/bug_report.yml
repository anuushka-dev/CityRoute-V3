name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can - a precise reproduction is worth more than a long description.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The behaviour you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands or requests. Include the response body or traceback.
      placeholder: |
        1. Start the service with ...
        2. POST /matrix with ...
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it?
      options:
        - cityroute-v3.ps1 or the run scripts (Windows, local)
        - uvicorn directly from the repository
        - Docker
        - Docker Compose
        - Render or another host
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04 ...
    validations:
      required: true

  - type: input
    id: graph
    attributes:
      label: Graph file in use
      description: `CITYROUTE_GRAPH_FILE` and the value of `graph_loader` from `/graph/stats`.
      placeholder: kanpur_central.graphml, loader networkx
    validations:
      required: false

  - type: textarea
    id: health
    attributes:
      label: /health/ready and startup log
      description: The readiness response and the graph loading lines from the startup log.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues
          required: true
        - label: I removed any secrets, tokens or personal paths from the output I pasted
          required: true
